
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2457a7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Repeating Tasks</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f4f8;
  margin: 0;
  padding: 20px;
  color: #243247;
}
.app {
  max-width: 480px;
  margin: auto;
}
h1 { text-align: center; color: #2457a7; }
.panel, .task {
  background: white;
  padding: 18px;
  margin-bottom: 15px;
  border-radius: 14px;
  box-shadow: 0 2px 8px #00000012;
}
input {
  box-sizing: border-box;
  width: 100%;
  padding: 12px;
  margin: 6px 0 12px;
  border: 1px solid #ccd3df;
  border-radius: 8px;
  font-size: 16px;
}
button {
  border: none;
  padding: 11px 14px;
  margin: 4px 2px;
  border-radius: 8px;
  background: #2457a7;
  color: white;
  font-size: 14px;
  cursor: pointer;
}
button.secondary { background: #64748b; }
button.complete { background: #16834a; }
button.delete { background: #b94343; }
.time {
  font-size: 38px;
  font-weight: bold;
  text-align: center;
  margin: 12px;
  color: #2457a7;
}
.status {
  text-align: center;
  color: #64748b;
}
.task h3 { margin-bottom: 4px; }
small { color: #64748b; }
</style>
</head>

<body>
<div class="app">
  <h1>My Repeating Tasks</h1>

  <div class="panel">
    <h3>Add a New Task</h3>

    <label for="taskName">Task name</label>
    <input id="taskName" placeholder="Example: Take a break">

    <label for="interval">Repeat every (minutes)</label>
    <input id="interval" type="number" min="1" value="30">

    <button onclick="addTask()">Add Task</button>
  </div>

  <h3>My Tasks</h3>
  <div id="taskList"></div>
</div>

<script>
let tasks = JSON.parse(
  localStorage.getItem("myTasks") || "[]"
);

function saveTasks() {
  localStorage.setItem("myTasks", JSON.stringify(tasks));
}

function addTask() {
  const name = document.getElementById("taskName").value.trim();
  const minutes = Number(document.getElementById("interval").value);

  if (!name || !Number.isFinite(minutes) || minutes < 1) {
    alert("Enter a task name and a valid interval.");
    return;
  }

  tasks.push({
    id: Date.now(),
    name: name,
    interval: minutes * 60,
    remaining: minutes * 60,
    endsAt: null
  });

  document.getElementById("taskName").value = "";
  saveTasks();
  renderTasks();
}

function remaining(task) {
  if (task.endsAt === null) return task.remaining;

  return Math.max(
    0,
    Math.ceil((task.endsAt - Date.now()) / 1000)
  );
}

function formatTime(seconds) {
  const hours = Math.floor(seconds / 3600);
  const mins = Math.floor((seconds % 3600) / 60);
  const secs = seconds % 60;

  if (hours > 0) {
    return String(hours).padStart(2, "0") + ":" +
      String(mins).padStart(2, "0") + ":" +
      String(secs).padStart(2, "0");
  }

  return String(mins).padStart(2, "0") + ":" +
    String(secs).padStart(2, "0");
}

function startTask(id) {
  const task = tasks.find(t => t.id === id);
  if (!task || task.endsAt !== null) return;

  task.endsAt = Date.now() + task.remaining * 1000;
  saveTasks();
  renderTasks();
}

function pauseTask(id) {
  const task = tasks.find(t => t.id === id);
  if (!task || task.endsAt === null) return;

  task.remaining = remaining(task);
  task.endsAt = null;
  saveTasks();
  renderTasks();
}

function completeTask(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;

  task.remaining = task.interval;
  task.endsAt = Date.now() + task.interval * 1000;

  saveTasks();
  renderTasks();
}

function deleteTask(id) {
  if (!confirm("Delete this task?")) return;

  tasks = tasks.filter(t => t.id !== id);
  saveTasks();
  renderTasks();
}

function renderTasks() {
  const list = document.getElementById("taskList");

  if (tasks.length === 0) {
    list.innerHTML = "<p>No tasks yet. Add one above!</p>";
    return;
  }

  list.innerHTML = tasks.map(task => {
    const seconds = remaining(task);
    const running = task.endsAt !== null;

    return `
      <div class="task">
        <h3>${escapeHTML(task.name)}</h3>
        <small>Repeats every ${task.interval / 60} minutes</small>

        <div class="time" id="time-${task.id}">
          ${formatTime(seconds)}
        </div>

        <div class="status" id="status-${task.id}">
          ${running ? "Running" : "Paused"}
        </div>

        <button
          class="secondary"
          onclick="pauseTask(${task.id})"
          ${running ? "" : "disabled"}>
          Pause
        </button>

        <button
          onclick="startTask(${task.id})"
          ${running ? "disabled" : ""}>
          Start
        </button>

        <button class="complete"
          onclick="completeTask(${task.id})">
          Complete & Restart
        </button>

        <button class="delete"
          onclick="deleteTask(${task.id})">
          Delete
        </button>
      </div>
    `;
  }).join("");
}

function escapeHTML(value) {
  return value.replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

// Update countdown displays every second.
setInterval(() => {
  tasks.forEach(task => {
    const timeElement =
      document.getElementById("time-" + task.id);

    const statusElement =
      document.getElementById("status-" + task.id);

    if (!timeElement) return;

    const seconds = remaining(task);
    timeElement.textContent = formatTime(seconds);

    if (task.endsAt !== null && seconds === 0) {
      task.endsAt = null;
      task.remaining = 0;
      saveTasks();
    }

    statusElement.textContent =
      task.endsAt !== null ? "Running" :
      task.remaining === 0 ? "Time expired" : "Paused";
  });
}, 1000);

renderTasks();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .then(() => console.log("Offline support enabled"))
      .catch(error => console.error("Service worker error:", error));
  });
}
</script></body>
</html>
