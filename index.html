
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Repeating Tasks</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2457a7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f4f8;
  margin: 0;
  padding: 20px;
  color: #243247;
}
.app {
  max-width: 480px;
  margin: auto;
}
h1 { text-align: center; color: #2457a7; }
.panel, .task {
  background: white;
  padding: 18px;
  margin-bottom: 15px;
  border-radius: 14px;
  box-shadow: 0 2px 8px #00000012;
}
input {
  box-sizing: border-box;
  width: 100%;
  padding: 12px;
  margin: 6px 0 12px;
  border: 1px solid #ccd3df;
  border-radius: 8px;
  font-size: 16px;
}
button {
  border: none;
  padding: 12px 14px;
  margin: 4px 2px;
  border-radius: 8px;
  background: #2457a7;
  color: white;
  font-size: 15px;
  cursor: pointer;
}
button:disabled {
  opacity: .4;
}
button.secondary { background: #64748b; }
button.complete { background: #16834a; }
button.delete { background: #b94343; }
.time {
  font-size: 38px;
  font-weight: bold;
  text-align: center;
  margin: 12px;
  color: #2457a7;
}
.status {
  text-align: center;
  color: #64748b;
}
.task h3 { margin-bottom: 4px; }
small { color: #64748b; }

#alertBox {
  display: none;
  position: fixed;
  inset: 0;
  background: #0009;
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.alertContent {
  background: white;
  border-radius: 18px;
  padding: 25px;
  width: 100%;
  max-width: 350px;
  text-align: center;
}
.alertContent h2 { color: #b94343; }
.alertContent button {
  display: block;
  width: 100%;
  margin: 10px 0;
}
</style>
</head>

<body>
<div class="app">

  <h1>My Repeating Tasks</h1>

  <div class="panel">
    <h3>Notification Settings</h3>
    <button onclick="enableAlerts()">
      Enable Sound & Notifications
    </button>
    <p id="permissionStatus">Notifications not enabled yet.</p>
  </div>

  <div class="panel">
    <h3>Add a New Task</h3>

    <label for="taskName">Task name</label>
    <input id="taskName" placeholder="Example: Take a break">

    <label for="interval">Repeat every (minutes)</label>
    <input id="interval" type="number" min="1" value="30">

    <button onclick="addTask()">Add Task</button>
  </div>

  <h3>My Tasks</h3>
  <div id="taskList"></div>
</div>

<!-- Timer expiration alert -->
<div id="alertBox">
  <div class="alertContent">
    <h2>Time is up!</h2>
    <h3 id="expiredTaskName"></h3>
    <p>What would you like to do?</p>

    <button class="complete" onclick="restartExpiredTask()">
      Restart Timer
    </button>

    <button class="secondary" onclick="pauseExpiredTask()">
      Leave Paused
    </button>
  </div>
</div>

<script>
let tasks = JSON.parse(
  localStorage.getItem("myTasks") || "[]"
);

let expiredTaskId = null;
let audioContext = null;

function saveTasks() {
  localStorage.setItem("myTasks", JSON.stringify(tasks));
}

function unlockAudio() {
  try {
    const Audio =
      window.AudioContext || window.webkitAudioContext;

    if (Audio) {
      if (!audioContext) audioContext = new Audio();
      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
    }
  } catch (error) {
    console.log("Audio unavailable", error);
  }
}

function playAlert() {
  if (!audioContext || audioContext.state !== "running") return;

  [0, 0.35, 0.7].forEach(delay => {
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = 880;
    gain.gain.value = 0.15;

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(audioContext.currentTime + delay);
    oscillator.stop(audioContext.currentTime + delay + 0.18);
  });
}

async function enableAlerts() {
  unlockAudio();

  if (!("Notification" in window)) {
    document.getElementById("permissionStatus").textContent =
      "Notifications are not supported by this browser.";
    return;
  }

  try {
    const permission = await Notification.requestPermission();

    document.getElementById("permissionStatus").textContent =
      permission === "granted"
        ? "Notifications enabled!"
        : "Notification permission: " + permission;

    if (permission === "granted") {
      const registration = await navigator.serviceWorker.ready;

      await registration.showNotification("My Tasks", {
        body: "Notifications are working!",
        tag: "my-tasks-test"
      });
    }
  } catch (error) {
    document.getElementById("permissionStatus").textContent =
      "Unable to enable notifications.";
    console.log(error);
  }
}

function addTask() {
  const name =
    document.getElementById("taskName").value.trim();

  const minutes =
    Number(document.getElementById("interval").value);

  if (!name || !Number.isFinite(minutes) || minutes < 1) {
    alert("Enter a task name and a valid interval.");
    return;
  }

  tasks.push({
    id: Date.now(),
    name: name,
    interval: minutes * 60,
    remaining: minutes * 60,
    endsAt: null
  });

  document.getElementById("taskName").value = "";

  saveTasks();
  renderTasks();
}

function remaining(task) {
  if (task.endsAt === null) return task.remaining;

  return Math.max(
    0,
    Math.ceil((task.endsAt - Date.now()) / 1000)
  );
}

function formatTime(seconds) {
  const hours = Math.floor(seconds / 3600);
  const mins = Math.floor((seconds % 3600) / 60);
  const secs = seconds % 60;

  if (hours > 0) {
    return String(hours).padStart(2, "0") + ":" +
      String(mins).padStart(2, "0") + ":" +
      String(secs).padStart(2, "0");
  }

  return String(mins).padStart(2, "0") + ":" +
    String(secs).padStart(2, "0");
}

function startTask(id) {
  const task = tasks.find(t => t.id === id);
  if (!task || task.endsAt !== null) return;

  unlockAudio();

  task.endsAt = Date.now() + task.remaining * 1000;

  saveTasks();
  renderTasks();
}

function pauseTask(id) {
  const task = tasks.find(t => t.id === id);
  if (!task || task.endsAt === null) return;

  task.remaining = remaining(task);
  task.endsAt = null;

  saveTasks();
  renderTasks();
}

function deleteTask(id) {
  if (!confirm("Delete this task?")) return;

  tasks = tasks.filter(t => t.id !== id);

  if (expiredTaskId === id) closeAlert();

  saveTasks();
  renderTasks();
}

function completeTask(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;

  task.remaining = task.interval;
  task.endsAt = Date.now() + task.interval * 1000;

  saveTasks();
  renderTasks();
}

function timerExpired(task) {
  if (expiredTaskId !== null) return;

  expiredTaskId = task.id;

  playAlert();

  document.getElementById("expiredTaskName").textContent =
    task.name;

  document.getElementById("alertBox").style.display = "flex";

  if (Notification.permission === "granted") {
    navigator.serviceWorker.ready.then(registration => {
      return registration.showNotification("Time is up!", {
        body: task.name + " is ready for your attention.",
        tag: "task-" + task.id
      });
    }).catch(error => console.log(error));
  }
}

function restartExpiredTask() {
  const task = tasks.find(t => t.id === expiredTaskId);

  if (task) {
    task.remaining = task.interval;
    task.endsAt = Date.now() + task.interval * 1000;
    saveTasks();
  }

  closeAlert();
  renderTasks();
}

function pauseExpiredTask() {
  closeAlert();
  renderTasks();
}

function closeAlert() {
  document.getElementById("alertBox").style.display = "none";
  expiredTaskId = null;
}

function escapeHTML(value) {
  return value.replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function renderTasks() {
  const list = document.getElementById("taskList");

  if (tasks.length === 0) {
    list.innerHTML = "<p>No tasks yet. Add one above!</p>";
    return;
  }

  list.innerHTML = tasks.map(task => {
    const seconds = remaining(task);
    const running = task.endsAt !== null;

    return `
      <div class="task">
        <h3>${escapeHTML(task.name)}</h3>
        <small>Repeats every ${task.interval / 60} minutes</small>

        <div class="time" id="time-${task.id}">
          ${formatTime(seconds)}
        </div>

        <div class="status" id="status-${task.id}">
          ${running ? "Running" : "Paused"}
        </div>

        <button class="secondary"
          onclick="pauseTask(${task.id})"
          ${running ? "" : "disabled"}>
          Pause
        </button>

        <button onclick="startTask(${task.id})"
          ${running ? "disabled" : ""}>
          Start
        </button>

        <button class="complete"
          onclick="completeTask(${task.id})">
          Complete & Restart
        </button>

        <button class="delete"
          onclick="deleteTask(${task.id})">
          Delete
        </button>
      </div>
    `;
  }).join("");
}

// Monitor countdowns and detect expiration.
setInterval(() => {
  tasks.forEach(task => {
    const timeElement =
      document.getElementById("time-" + task.id);

    const statusElement =
      document.getElementById("status-" + task.id);

    if (!timeElement) return;

    const seconds = remaining(task);

    timeElement.textContent = formatTime(seconds);

    if (task.endsAt !== null && seconds === 0) {
      task.endsAt = null;
      task.remaining = 0;

      saveTasks();
      timerExpired(task);
    }

    statusElement.textContent =
      task.endsAt !== null ? "Running" :
      task.remaining === 0 ? "Time expired" : "Paused";
  });
}, 1000);

renderTasks();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .catch(error => console.error(error));
  });
}
</script>

</body>
</html>
